name = "shoplink-d1"
compatibility_date = "2025-01-01"
main = "src/index.ts"

[vars]
APP_URL = "https://shop.chatourtravel.com"

[[d1_databases]]
binding = "DB"
database_name = "shoplink-d1"
database_id = "ddec977c-de52-4e8b-8b1b-5117a3a37182"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "shoplink-d1-assets"

# Frontend statis (public/) diserve oleh Workers Assets.
# binding "STATIC" dipakai agar tidak bentrok dengan binding R2 "ASSETS".
[assets]
directory = "./public"
binding = "STATIC"
not_found_handling = "single-page-application"
