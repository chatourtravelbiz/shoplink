<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{var t=localStorage.getItem('ct-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}}catch(e){}</script>
  <title>Chatour Travel — Link-in-Bio Agen (Umroh &amp; Haji)</title>
  <meta name="description" content="Chatour Travel, biro Umroh & Haji: etalase paket dan produk agen dalam satu link bio. Order via WhatsApp, COD, atau transfer — tanpa pembayaran online." />
  <link rel="icon" type="image/png" href="/logo-chatour.png" />
  <link rel="stylesheet" href="/tailwind.css" />
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar { transition: height .3s ease; }
    input, select, textarea { outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #b02a00; box-shadow: 0 0 0 2px rgba(176,42,0,.15); }
    /* Mode gelap: timpa utilitas Tailwind yang dipakai aplikasi. Tombol
       merah bata & hijau WA dipertahankan (kontrasnya tetap cukup). */
    .dark { color-scheme: dark; }
    .dark .bg-stone-50 { background-color: #1c1917 !important; }
    .dark .bg-white { background-color: #292524 !important; }
    .dark .bg-white\/90 { background-color: rgba(41, 37, 36, .92) !important; }
    .dark .bg-stone-100 { background-color: #44403c !important; }
    .dark .hover\:bg-stone-100:hover { background-color: #44403c !important; }
    .dark .hover\:bg-rose-50:hover { background-color: #4c0519 !important; }
    .dark .border-stone-200 { border-color: #44403c !important; }
    .dark .border-stone-300 { border-color: #57534e !important; }
    .dark .border-stone-800 { border-color: #e7e5e4 !important; }
    .dark .border-rose-200 { border-color: #881337 !important; }
    .dark .text-stone-900 { color: #fafaf9 !important; }
    .dark .text-stone-800 { color: #f5f5f4 !important; }
    .dark .text-stone-700 { color: #e7e5e4 !important; }
    .dark .text-stone-600 { color: #d6d3d1 !important; }
    .dark .text-stone-500 { color: #a8a29e !important; }
    .dark .text-stone-400 { color: #a8a29e !important; }
    .dark .text-red-700 { color: #fca5a5 !important; }
    .dark .text-red-800 { color: #fecaca !important; }
    .dark .text-rose-700 { color: #fda4af !important; }
    .dark .bg-red-100 { background-color: #7f1d1d !important; }
    .dark .bg-rose-50 { background-color: #4c0519 !important; }
    .dark input, .dark select, .dark textarea { background-color: #292524 !important; color: #fafaf9 !important; border-color: #57534e !important; }
    .dark input::placeholder, .dark textarea::placeholder { color: #78716c !important; }
    /* Tombol kembali ke atas — muncul setelah scroll > 400px. */
    .scroll-top {
      position: fixed; right: 20px; bottom: 20px; z-index: 40;
      width: 44px; height: 44px; border: none; border-radius: 999px;
      background: #b02a00; color: #fff; font-size: 1.25rem; line-height: 1;
      cursor: pointer; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .scroll-top:hover { background: #7e1e00; }
    .scroll-top.show { opacity: 1; pointer-events: auto; }
    /* Bottom nav mobile: beri ruang di bawah konten agar tidak tertutup nav,
       dan naikkan tombol kembali-ke-atas di atas nav. Hanya berlaku saat
       bottom nav dirender (halaman SPA login), bukan di toko publik. */
    @media (max-width: 767px) {
      body:has(.mobile-bottom-nav) { padding-bottom: 4.25rem; }
      .scroll-top { bottom: 76px; }
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen">
  <div id="app"><p style="text-align:center;padding:3rem 1rem;color:#78716c">Memuat…</p></div>
  <button id="scroll-top" type="button" class="scroll-top" aria-label="Kembali ke atas">↑</button>
  <script type="module" src="/js/app.js"></script>
  <script>(function(){var b=document.getElementById('scroll-top');var t=function(){b.classList.toggle('show',window.scrollY>400)};t();window.addEventListener('scroll',t,{passive:true});b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});})();</script>
</body>
</html>
